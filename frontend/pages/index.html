<!DOCTYPE html>
<html lang="es">

<head>
    <script>
        const tokenActivo = sessionStorage.getItem("token");
        if (tokenActivo) {
            window.location.replace("dashboard.html");
        }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SOUVANIC - Iniciar sesión</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Mejoras UI/UX -->
    <style>
        .login-forgot-password {
            text-align: right;
            margin-bottom: 1rem;
            margin-top: -0.5rem;
        }
        .login-forgot-password a {
            color: #1a4b77; /* Azul corporativo */
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
        }
        .login-forgot-password a:hover {
            text-decoration: underline;
        }
        /* Estados de interacción */
        .login-input {
            border: 1px solid #ddd;
            transition: all 0.3s ease;
        }
        .login-input:focus-within {
            border-color: #1a4b77;
            box-shadow: 0 0 0 3px rgba(26, 75, 119, 0.1);
        }
        .login-input input:focus {
            outline: none;
        }
        .login-btn {
            transition: background-color 0.3s ease;
        }
        .login-btn:hover {
            background-color: #113355; /* Azul más oscuro */
        }
        /* Limpiar fondo logo derecho */
        .login-brand-logo {
            background-color: transparent !important;
            padding: 0 !important;
            border-radius: 0 !important;
            box-shadow: none !important;
        }
    </style>
</head>

<body class="login-page">

    <main class="login-shell">

        <!-- PANEL DE FORMULARIO -->
        <section class="login-panel-form">
            <div class="login-container loging-container">

                <!-- Se eliminó el login-header (Logo y H1 repetidos) -->

                <div class="login-card">

                    <h2>Bienvenido</h2>
                    <p>Ingresá tus credenciales para continuar</p>

                    <div id="loginAlerta" class="login-alerta" hidden role="alert">
                        <i class="bi bi-exclamation-circle-fill"></i>
                        <span id="loginAlertaTexto"></span>
                    </div>

                    <form id="logingForm">

                        <div class="login-campo">
                            <label for="usuario">Usuario</label>
                            <div class="login-input">
                                <i class="bi bi-person"></i>
                                <input type="text" id="usuario" placeholder="Ingresá tu usuario"
                                    autocomplete="username" required>
                            </div>
                        </div>

                        <div class="login-campo">
                            <label for="contraseña">Contraseña</label>
                            <div class="login-input">
                                <i class="bi bi-lock"></i>
                                <input type="password" id="contraseña" placeholder="Ingresá tu contraseña"
                                    autocomplete="current-password" required>

                                <button type="button" id="togglePassword" class="login-toggle-password"
                                    aria-label="Mostrar u ocultar contraseña">
                                    <i class="bi bi-eye" id="togglePasswordIcon"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Enlace de recuperación añadido -->
                        <div class="login-forgot-password">
                            <a href="#">¿Olvidaste tu contraseña?</a>
                        </div>

                        <button type="submit" id="btnLoginSubmit" class="login-btn">
                            <span>Iniciar sesión</span>
                            <i class="bi bi-arrow-right"></i>
                        </button>

                    </form>

                </div>

                <p class="login-footer">
                    © 2026 Nicaragua Souvenir
                </p>

            </div>
        </section>

        <!-- PANEL DE IDENTIDAD -->
        <aside class="login-panel-brand" aria-hidden="true">

            <div class="login-brand-pattern"></div>

            <div class="login-brand-content">
                <img src="../assets/Logo.png" alt="Logotipo Nicaragua Souvenir" class="login-brand-logo">
                <h2>SOUVANIC</h2>
                <p>Portal administrativo<br>de Nicaragua Souvenir</p>
            </div>

            <p class="login-brand-footer">Nicaragua Souvenir · Sistema de facturación</p>

        </aside>

    </main>

    <script src="../js/core/neurona.js"></script>
    <script src="../js/modules/login.js"></script>

</body>

</html>
